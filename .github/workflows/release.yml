name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make prepush
      - name: Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.24.7
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Security scan
        run: make test-security
      - run: make test-scenarios
      - run: make test-docs-consistency
      - run: make test-docs-storyline
      - name: Docs links
        run: make test-docs-links
      - name: Verify authoritative governance release contract
        run: make test-authoritative-release
      - name: Install Cosign for upstream release verification
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v2.6.5
      - name: Acquire authoritative release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          AXYM_GAIT_AUTHORITATIVE_RELEASE_TAG: ${{ vars.AXYM_GAIT_AUTHORITATIVE_RELEASE_TAG }}
        run: |
          gait_tag="${AXYM_GAIT_AUTHORITATIVE_RELEASE_TAG:-v1.7.2}"
          mkdir -p .tmp/authoritative-input
          for attempt in 1 2 3 4 5; do
            if gh release download "${gait_tag}" --repo Clyra-AI/gait --dir .tmp/authoritative-input --clobber; then
              break
            fi
            test "${attempt}" -lt 5 || { echo "failed to download Gait ${gait_tag} authoritative release"; exit 1; }
            sleep $((attempt * 10))
          done
          mkdir -p .tmp/authoritative-input/action-contract-authoritative
          mv .tmp/authoritative-input/action-contract-authoritative-evidence-${gait_tag}.zip .tmp/authoritative-input/action-contract-authoritative/
          mv .tmp/authoritative-input/public-key.b64 .tmp/authoritative-input/action-contract-authoritative/
          unzip -oq .tmp/authoritative-input/action-contract-authoritative/action-contract-authoritative-evidence-${gait_tag}.zip -d .tmp/authoritative-input/action-contract-authoritative
          (cd .tmp/authoritative-input && sha256sum -c checksums.txt)
          cosign verify-blob \
            --certificate .tmp/authoritative-input/checksums.txt.pem \
            --certificate-identity "https://github.com/Clyra-AI/gait/.github/workflows/release.yml@refs/tags/${gait_tag}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --signature .tmp/authoritative-input/checksums.txt.sig \
            .tmp/authoritative-input/checksums.txt
          proposal_input="$(find .tmp/authoritative-input -type f -name 'proposal.json' -print -quit)"
          activation_input="$(find .tmp/authoritative-input -type f -name 'activation.json' -print -quit)"
          lifecycle_input="$(find .tmp/authoritative-input -type f -name 'lifecycle.json' -print -quit)"
          gate_input="$(find .tmp/authoritative-input -type f -name '*gate*.json' -print -quit)"
          gait_key_input="$(find .tmp/authoritative-input -type f -name 'public-key.b64' -print -quit)"
          test -n "${proposal_input}" && test -n "${activation_input}" && test -n "${lifecycle_input}" && test -n "${gait_key_input}" || { echo "authoritative input archive must contain proposal, activation, lifecycle, and public key"; exit 1; }
          printf 'AXYM_AUTHORITATIVE_PROPOSAL_INPUT=%s\n' "${proposal_input}" >> "$GITHUB_ENV"
          printf 'AXYM_AUTHORITATIVE_ACTIVATION_INPUT=%s\n' "${activation_input}" >> "$GITHUB_ENV"
          printf 'AXYM_AUTHORITATIVE_LIFECYCLE_INPUT=%s\n' "${lifecycle_input}" >> "$GITHUB_ENV"
          printf 'AXYM_AUTHORITATIVE_GATE_INPUT=%s\n' "${gate_input}" >> "$GITHUB_ENV"
          printf 'AXYM_AUTHORITATIVE_GAIT_KEY_INPUT=%s\n' "${gait_key_input}" >> "$GITHUB_ENV"
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.18.0
      - name: Build
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.14.1
          args: release --clean --skip publish
      - name: Generate authoritative Action Contract governance release
        run: |
          test -n "${AXYM_AUTHORITATIVE_PROPOSAL_INPUT:-}" || { echo "AXYM_AUTHORITATIVE_PROPOSAL_INPUT must name the downloaded authoritative release input"; exit 1; }
          test -n "${AXYM_AUTHORITATIVE_ACTIVATION_INPUT:-}" || { echo "AXYM_AUTHORITATIVE_ACTIVATION_INPUT must name the downloaded authoritative release input"; exit 1; }
          test -n "${AXYM_AUTHORITATIVE_LIFECYCLE_INPUT:-}" || { echo "AXYM_AUTHORITATIVE_LIFECYCLE_INPUT must name the downloaded authoritative release input"; exit 1; }
          test -n "${AXYM_AUTHORITATIVE_GAIT_KEY_INPUT:-}" || { echo "AXYM_AUTHORITATIVE_GAIT_KEY_INPUT must name the downloaded authoritative release input"; exit 1; }
          go run ./scripts/generate_authoritative_governance_release.go \
            --out dist \
            --proposal-input "${AXYM_AUTHORITATIVE_PROPOSAL_INPUT}" \
            --activation-input "${AXYM_AUTHORITATIVE_ACTIVATION_INPUT}" \
            --lifecycle-input "${AXYM_AUTHORITATIVE_LIFECYCLE_INPUT}" \
            --gate-input "${AXYM_AUTHORITATIVE_GATE_INPUT:-}" \
            --gait-public-key "${AXYM_AUTHORITATIVE_GAIT_KEY_INPUT}" \
            --tag "${GITHUB_REF_NAME}" \
            --commit "$(git rev-list -n1 "${GITHUB_REF_NAME}^{commit}")" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --run-id "${GITHUB_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}"
          go run ./scripts/verify_authoritative_governance_release.go \
            --root dist \
            --tag "${GITHUB_REF_NAME}" \
            --commit "$(git rev-list -n1 "${GITHUB_REF_NAME}^{commit}")" \
            --trusted-key-sha256 "sha256:$(sha256sum dist/axym-authoritative-action-contract-public-key.b64 | awk '{print $1}')"
      - name: Anchor authoritative governance assets in checksums
        run: |
          (
            cd dist
            find . -maxdepth 1 -type f -name 'axym-authoritative-*' -print0 | sort -z | xargs -0 sha256sum >> checksums.txt
            sort -k2 checksums.txt -o checksums.txt
          )
          (cd dist && sha256sum -c checksums.txt)
      - name: Verify checksums
        run: sha256sum -c checksums.txt
        working-directory: dist
      - name: Generate SBOM
        run: |
          syft scan dir:dist -o spdx-json=dist/axym.spdx.json
          test -s dist/axym.spdx.json
      - name: Build scanner target
        run: mkdir -p .tmp && go build -o .tmp/axym ./cmd/axym
      - name: Vulnerability scan
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && govulncheck -mode=binary .tmp/axym
      - name: Sign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v2.6.5
      - name: Sign checksums
        run: cosign sign-blob --yes --output-signature dist/checksums.txt.sig --output-certificate dist/checksums.txt.pem dist/checksums.txt
      - name: Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/**"
      - name: Record provenance receipt
        run: |
          printf '{"builder":"github-actions","tag":"%s","subject":"dist/**"}\n' "${GITHUB_REF_NAME}" > dist/github-attestation.provenance.json
      - name: Build release smoke binary
        run: go build -o .tmp/axym-release-smoke ./cmd/axym
      - name: Verify release integrity
        run: ./scripts/release_go_nogo.sh --dist-dir dist --binary-name axym --release-binary .tmp/axym-release-smoke
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --title "${TAG}" --notes ""
          mapfile -t files < <(find dist -maxdepth 1 -type f -print)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release artifacts found in dist/"
            exit 1
          fi
          gh release upload "${TAG}" "${files[@]}" --clobber
